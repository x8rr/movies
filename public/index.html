<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>movies</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #e0e0e0; font-family: -apple-system, system-ui, sans-serif; }

    .header { padding: 16px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #1a1a1a; }
    .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
    .search-box { flex: 1; max-width: 480px; }
    .search-box input {
      width: 100%; padding: 10px 16px; background: #161616; border: 1px solid #2a2a2a;
      border-radius: 8px; color: #fff; font-size: 14px; outline: none;
    }
    .search-box input:focus { border-color: #444; }
    .search-box input::placeholder { color: #555; }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .section-title { font-size: 14px; color: #888; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }

    .card {
      cursor: pointer; border-radius: 8px; overflow: hidden;
      background: #161616; transition: transform 0.15s;
    }
    .card:hover { transform: scale(1.03); }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .card .info { padding: 8px 10px; }
    .card .title { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .year { font-size: 11px; color: #666; margin-top: 2px; }
    .no-poster { width: 100%; aspect-ratio: 2/3; background: #222; display: flex; align-items: center; justify-content: center; color: #444; font-size: 12px; }

    .player-overlay {
      display: none; position: fixed; inset: 0; background: #000; z-index: 100;
      flex-direction: column;
    }
    .player-overlay.active { display: flex; }
    .player-bar {
      padding: 12px 20px; display: flex; align-items: center; gap: 12px;
      background: #111; border-bottom: 1px solid #222;
    }
    .player-bar .back { cursor: pointer; color: #888; font-size: 20px; }
    .player-bar .back:hover { color: #fff; }
    .player-bar .now-playing { font-size: 14px; color: #ccc; }
    .player-bar .status { margin-left: auto; font-size: 12px; color: #666; }
    video { flex: 1; width: 100%; background: #000; }

    .loading { text-align: center; padding: 60px; color: #555; }

    .detail-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50;
      overflow-y: auto;
    }
    .detail-overlay.active { display: block; }
    .detail-content { max-width: 700px; margin: 40px auto; padding: 24px; }
    .detail-close { cursor: pointer; color: #888; font-size: 24px; float: right; }
    .detail-close:hover { color: #fff; }
    .detail-header { display: flex; gap: 20px; margin-bottom: 20px; }
    .detail-poster { width: 180px; border-radius: 8px; }
    .detail-info h2 { color: #fff; font-size: 22px; margin-bottom: 8px; }
    .detail-info .meta-line { font-size: 13px; color: #888; margin-bottom: 4px; }
    .detail-info .overview { font-size: 14px; color: #aaa; line-height: 1.5; margin-top: 12px; }
    .play-btn {
      margin-top: 16px; padding: 10px 28px; background: #e50914; color: #fff;
      border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    .play-btn:hover { background: #f40612; }
    .play-btn:disabled { background: #444; cursor: wait; }

    .seasons { margin-top: 20px; }
    .season-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .season-tab {
      padding: 6px 14px; background: #222; border: none; border-radius: 4px;
      color: #aaa; font-size: 13px; cursor: pointer;
    }
    .season-tab.active { background: #e50914; color: #fff; }
    .episode-list { display: flex; flex-direction: column; gap: 6px; }
    .episode-item {
      padding: 10px 14px; background: #1a1a1a; border-radius: 6px;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .episode-item:hover { background: #222; }
    .episode-item .ep-title { font-size: 13px; color: #ddd; }
    .episode-item .ep-num { font-size: 12px; color: #666; }

    @media (max-width: 600px) {
      .header { flex-wrap: wrap; }
      .search-box { max-width: none; order: 3; width: 100%; }
      .detail-header { flex-direction: column; align-items: center; text-align: center; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>movies</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="search movies and shows...">
  </div>
</div>

<div class="container">
  <div id="trendingSection">
    <p class="section-title">trending</p>
    <div class="grid" id="trendingGrid"></div>
  </div>
  <div id="searchSection" style="display:none">
    <p class="section-title">results</p>
    <div class="grid" id="searchGrid"></div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-content" id="detailContent"></div>
</div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-bar">
    <span class="back" id="playerClose">&#x2715;</span>
    <span class="now-playing" id="nowPlaying"></span>
    <span class="status" id="playerStatus"></span>
  </div>
  <video id="videoPlayer" controls autoplay></video>
</div>

<script>
const API = '';
const IMG = 'https://image.tmdb.org/t/p';

let searchTimer;
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) {
    document.getElementById('searchSection').style.display = 'none';
    document.getElementById('trendingSection').style.display = '';
    return;
  }
  searchTimer = setTimeout(() => search(q), 400);
});

async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function cardHTML(item) {
  const title = item.title || item.name;
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);
  const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
  const poster = item.poster_path
    ? `<img src="${IMG}/w300${item.poster_path}" alt="${title}" loading="lazy">`
    : `<div class="no-poster">No Poster</div>`;
  return `<div class="card" onclick="openDetail(${item.id}, '${type}')">
    ${poster}
    <div class="info"><div class="title">${title}</div><div class="year">${year} &middot; ${type}</div></div>
  </div>`;
}

async function loadTrending() {
  try {
    const data = await api('/api/trending/all/week');
    document.getElementById('trendingGrid').innerHTML = data.results.slice(0, 18).map(cardHTML).join('');
  } catch (e) {
    document.getElementById('trendingGrid').innerHTML = `<p class="loading">could not load trending &mdash; is TMDB_API_KEY set?</p>`;
  }
}

async function search(query) {
  const data = await api(`/api/search/multi?query=${encodeURIComponent(query)}`);
  const filtered = data.results.filter(r => r.media_type === 'movie' || r.media_type === 'tv');
  document.getElementById('searchGrid').innerHTML = filtered.length
    ? filtered.map(cardHTML).join('')
    : '<p class="loading">no results</p>';
  document.getElementById('searchSection').style.display = '';
  document.getElementById('trendingSection').style.display = 'none';
}

async function openDetail(id, type) {
  const overlay = document.getElementById('detailOverlay');
  const content = document.getElementById('detailContent');
  content.innerHTML = '<p class="loading">loading...</p>';
  overlay.classList.add('active');

  const data = await api(`/api/${type}/${id}`);
  const title = data.title || data.name;
  const year = (data.release_date || data.first_air_date || '').slice(0, 4);
  const poster = data.poster_path ? `<img class="detail-poster" src="${IMG}/w300${data.poster_path}">` : '';

  let html = `
    <span class="detail-close" onclick="closeDetail()">&#x2715;</span>
    <div class="detail-header">
      ${poster}
      <div class="detail-info">
        <h2>${title}</h2>
        <div class="meta-line">${year} &middot; ${type} ${data.runtime ? '&middot; ' + data.runtime + ' min' : ''}</div>
        <div class="overview">${data.overview || ''}</div>
        ${type === 'movie' ? `<button class="play-btn" onclick="scrapeAndPlay(${id}, 'movie', '${title.replace(/'/g, "\\'")}')">play</button>` : ''}
      </div>
    </div>`;

  if (type === 'tv' && data.seasons) {
    const realSeasons = data.seasons.filter(s => s.season_number > 0);
    html += `<div class="seasons">
      <div class="season-tabs" id="seasonTabs">
        ${realSeasons.map(s => `<button class="season-tab" onclick="loadEpisodes(${id}, ${s.season_number}, '${title.replace(/'/g, "\\'")}')">${s.name}</button>`).join('')}
      </div>
      <div class="episode-list" id="episodeList"><p class="loading">select a season</p></div>
    </div>`;
  }

  content.innerHTML = html;
}

async function loadEpisodes(showId, seasonNum, showTitle) {
  document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  const list = document.getElementById('episodeList');
  list.innerHTML = '<p class="loading">loading...</p>';

  const data = await api(`/api/tv/${showId}/season/${seasonNum}`);
  list.innerHTML = data.episodes.map(ep => `
    <div class="episode-item" onclick="scrapeAndPlay(${showId}, 'tv', '${showTitle.replace(/'/g, "\\'")}', ${seasonNum}, ${ep.episode_number})">
      <span class="ep-title">${ep.name}</span>
      <span class="ep-num">S${seasonNum}E${ep.episode_number}</span>
    </div>
  `).join('');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('active');
}

function playStream(stream, video, status) {
  if (stream.type === 'hls') {
    const url = stream.playlist;
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); status.textContent = ''; });
      hls.on(Hls.Events.ERROR, (_e, data) => {
        if (data.fatal) status.textContent = 'stream error';
      });
      video._hls = hls;
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play();
      status.textContent = '';
    }
    return true;
  }
  if (stream.type === 'file') {
    const qualities = stream.qualities;
    const best = qualities
      ? Object.values(qualities).sort((a, b) => (b.quality || 0) - (a.quality || 0))[0]
      : null;
    if (best?.url) {
      video.src = best.url;
      video.play();
      status.textContent = '';
      return true;
    }
  }
  return false;
}

async function scrapeAndPlay(id, type, title, season, episode) {
  const overlay = document.getElementById('playerOverlay');
  const video = document.getElementById('videoPlayer');
  const status = document.getElementById('playerStatus');
  const nowPlaying = document.getElementById('nowPlaying');

  overlay.classList.add('active');
  nowPlaying.textContent = type === 'tv' ? `${title} S${season}E${episode}` : title;
  status.textContent = 'finding sources...';
  video.src = '';

  const path = type === 'movie' ? `/api/scrape/movie/${id}` : `/api/scrape/tv/${id}/${season}/${episode}`;

  try {
    const r = await fetch(API + path);
    const data = await r.json();

    if (r.ok && data.stream) {
      status.textContent = 'loading stream...';
      if (playStream(data.stream, video, status)) return;
    }

    status.textContent = 'no sources available for this title';
  } catch (e) {
    status.textContent = 'error: ' + e.message;
  }
}

document.getElementById('playerClose').addEventListener('click', () => {
  const video = document.getElementById('videoPlayer');
  video.pause();
  video.src = '';
  if (video._hls) { video._hls.destroy(); video._hls = null; }
  document.getElementById('playerOverlay').classList.remove('active');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('playerOverlay').classList.remove('active');
    closeDetail();
  }
});

loadTrending();
</script>
</body>
</html>
